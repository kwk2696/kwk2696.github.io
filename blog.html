<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Blog - Woo Kyung Kim</title>
      <meta name="author" content="Woo Kyung Kim">
      <meta name="description" content="Blog by Woo Kyung Kim - notes on robotics, reinforcement learning, vision-language-action models, and building real robot systems.">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="icon" type="image/svg+xml" href="favicon.svg">
      <link rel="stylesheet" type="text/css" href="style.css">
      <script>
        (function() {
          var theme = localStorage.getItem('theme');
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        })();
      </script>
    </head>

  <body>
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="index.html#publications">Publications</a>
      <a href="blog.html" class="active">Blog</a>
      <button id="theme-toggle" aria-label="Toggle dark mode"></button>
    </nav>

    <div class="blog-container">
      <h1>Blog</h1>
      <div class="tag-filter" id="tag-filter"></div>
      <ul class="post-list" id="post-list">
        <li data-tags="robosynapse ros2">
          <div class="post-date">2026-09-19</div>
          <a class="post-title" href="blog/control-server-ros2.html">[Robosynapse] Control Server: Docker 위에 ROS2 올리기</a>
          <div class="post-tags"><span class="tag">robosynapse</span><span class="tag">ros2</span></div>
        </li>
      </ul>
      <script>
        (function() {
          var filterBox = document.getElementById('tag-filter');
          var posts = Array.prototype.slice.call(
            document.querySelectorAll('#post-list li[data-tags]'));

          var tags = [];
          posts.forEach(function(post) {
            post.getAttribute('data-tags').split(/\s+/).forEach(function(t) {
              if (t && tags.indexOf(t) === -1) tags.push(t);
            });
          });
          tags.sort();

          function select(tag) {
            Array.prototype.forEach.call(filterBox.children, function(btn) {
              btn.classList.toggle('active', btn.getAttribute('data-tag') === tag);
            });
            posts.forEach(function(post) {
              var postTags = post.getAttribute('data-tags').split(/\s+/);
              post.style.display =
                (tag === 'all' || postTags.indexOf(tag) !== -1) ? '' : 'none';
            });
          }

          function makeButton(tag, label) {
            var btn = document.createElement('span');
            btn.className = 'tag';
            btn.setAttribute('data-tag', tag);
            btn.textContent = label;
            btn.addEventListener('click', function() { select(tag); });
            filterBox.appendChild(btn);
          }

          makeButton('all', 'All');
          tags.forEach(function(t) { makeButton(t, t); });
          select('all');
        })();
      </script>
    </div>
    <footer class="site-footer">
      &copy; 2026 Woo Kyung Kim. All rights reserved.
    </footer>
    <script data-goatcounter="https://kwk2696.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
      (function() {
        var toggle = document.getElementById('theme-toggle');
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        toggle.textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF19';

        toggle.addEventListener('click', function() {
          isDark = !isDark;
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggle.textContent = '\u2600\uFE0F';
          } else {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            toggle.textContent = '\uD83C\uDF19';
          }
        });
      })();
    </script>
  </body>
</html>
